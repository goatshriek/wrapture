classes:
  - name: "OneClass"
    namespace: "wrapture_test"
    equivalent_struct:
      name: "one_struct"
      includes: "one_struct.h"
    functions:
      - name: "to_string"
        return:
          type: "const char *"
        wrapped:
          c:
            name: "one_struct_to_string"
            params:
              - value: "equivalent_struct_pointer"
