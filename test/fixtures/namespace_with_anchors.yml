to_string_common: &to_string_common
  name: ["to", "string"]
  return:
    type: "const char *"
name: [wrapture, test]
classes:
  - name: "OneClass"
    source:
      c:
        pointer:
          name: "one_struct"
          includes: "one_struct.h"
    functions:
      - <<: *to_string_common
        source:
          c:
            name: "one_struct_to_string"
            params:
              - value: "equivalent_struct_pointer"
  - name: "TwoClass"
    source:
      c:
        pointer:
          name: "two_struct"
          includes: "two_struct.h"
    functions:
      - <<: *to_string_common
        source:
          c:
            name: "two_struct_to_string"
            params:
              - value: "equivalent_struct_pointer"
  - name: "RedClass"
    source:
      c:
        pointer:
          name: "red_struct"
          includes: "red_struct.h"
    functions:
      - <<: *to_string_common
        source:
          c:
            name: "red_struct_to_string"
            params:
              - value: "equivalent_struct_pointer"
  - name: "BlueClass"
    source:
      c:
        pointer:
          name: "blue_struct"
          includes: "blue_struct.h"
    functions:
      - <<: *to_string_common
        source:
          c:
            name: "blue_struct_to_string"
            params:
              - value: "equivalent_struct_pointer"
