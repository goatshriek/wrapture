templates:
  - name: "common-return"
    value:
      return:
        type: "const char *"
  - name: "common-function"
    value:
      name: "to_string"
      use_template: "common-return"
      wrapped:
        c:
          name: "generic_to_string"
          params:
            - value: "equivalent_struct_pointer"
classes:
  - name: "OneClass"
    namespace: "wrapture_test"
    wrapped:
      c:
        name: "basic_struct_1"
        includes: "one_class.h"
    functions:
      - use_template: "common-function"
  - name: "TwoClass"
    namespace: "wrapture_test"
    wrapped:
      c:
        name: "basic_struct_1"
        includes: "one_class.h"
    functions:
      - use_template: "common-function"
