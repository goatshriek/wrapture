      - name: "member_1"
        type: "int"
    includes:
      - "constructed.h"
constructors:
  - params:
      - name: "new_name"
        type: "const char *"
    source:
      c:
        name: "build_a_struct"
        params:
          - name: "new_name"
            type: "const char *"
        return:
          type: "constructed_struct"
        includes: "constructed.h"
  - params:
      - name: "original"
        type: "self"
    source:
      c:
        name: "copy_struct"
        params:
          - name: "original_struct"
            type: "constructed_struct"
        return:
          type: "constructed_struct"
        includes:
          - "constructed.h"
destructor:
  source:
    c:
      name: "destroy_a_struct"
      params:
        - value: "self"
      includes:
        - "constructed.h"
functions:
  - name: "CompareToStruct"
    params:
      - name: "compare_to"
        type: "ClassWithConstructor"
    return:
      type: "int"
    source:
      c:
        name: "compare_structs"
        params:
          - value: "self"
            type: "constructed_struct *"
          - value: "compare_to"
            type: "constructed_struct *"
        return:
          type: "int"
