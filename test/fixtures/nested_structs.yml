name: [wrapture, test]
classes:
  - name: "Gym"
    source:
      c:
        name: "gym"
    functions:
      - name: "AddPool"
        params:
          - name: "new_pool"
            type:
              name: "Pool"
              includes: "Pool.hpp"
        source:
          c:
            name: "add_pool_to_gym"
            params:
              - name: "gym"
                type: "equivalent_struct_pointer"
              - name: "new_pool"
                type:
                  name: "struct gym_pool *"
                  includes: "gym.h"
      - name: "AddPoolCopy"
        params:
          - name: "original_pool"
            type:
              name: "Pool"
              includes: "Pool.hpp"
        source:
          c:
            name: "copy_pool_to_gym"
            params:
              - name: "gym"
                type: "equivalent_struct_pointer"
              - name: "original_pool"
                type:
                  name: "struct gym_pool"
                  includes: "gym.h"
      - name: "AddTrack"
        params:
          - name: "new_track"
            type:
              name: "Track"
              includes: "Track.hpp"
        source:
          c:
            name: "add_track_to_gym"
            params:
              - name: "gym"
                type: "equivalent_struct_pointer"
              - name: "new_track"
                type:
                  name: "struct gym_track *"
                  includes: "gym.h"
      - name: "AddTrackCopy"
        params:
          - name: "original_track"
            type:
              name: "Track"
              includes: "Track.hpp"
        source:
          c:
            name: "copy_track_to_gym"
            params:
              - name: "gym"
                type: "equivalent_struct_pointer"
              - name: "original_track"
                type:
                  name: "struct gym_track"
                  includes: "gym.h"
  - name: "Pool"
    source:
      c:
        pointer:
          name: "gym_pool"
    constructors:
      - source:
            c:
              name: "new_pool"
              params:
                - name: "name"
                  type: "const char *"
              return:
                type: "equivalent_struct_pointer"
  - name: "Track"
    source:
      c:
        pointer:
          name: "gym_track"
    constructors:
      - source:
          c:
            name: "new_track"
            params:
              - name: "length"
                type: "int"
            return:
              type: "equivalent_struct_pointer"
