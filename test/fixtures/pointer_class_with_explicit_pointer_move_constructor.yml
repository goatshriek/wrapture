name: "PointerClassWithExplicitPointerConstructor"
source:
  c:
    pointer:
      name: "wrapped_struct"
constructors:
  - params:
      - name: "original_thing"
        type: "equivalent_struct_pointer"
    source:
      c:
        name: "new_thing"
        params:
          - name: "original_thing"
            type: "struct wrapped_struct *"
        return:
          type: "equivalent_struct_pointer"
destructor:
  source:
    c:
      name: "destroy_a_struct"
      params:
        - name: "equivalent_struct_pointer"
