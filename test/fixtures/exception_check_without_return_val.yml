name: "ErrorCheckWithoutReturnVal"
return:
  type: "int"
wrapped-function:
  name: "underlying_function"
  error-check:
    rules:
      - left-expression: "it_failed()"
        condition: "not-equals"
        right-expression: "false"
    error-action:
      name: "throw-exception"
      type: "CodeException"
      value: "failure_code()"
  return:
    type: "int"
