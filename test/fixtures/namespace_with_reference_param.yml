name: [wrapture, test]
classes:
  - name: "Bullet"
    source:
      c:
        name: "bullet_struct"
        includes: "bullet_struct.h"
    type: "pointer"
  - name: "Rifle"
    source:
      c:
        name: "rifle_struct"
        includes: "rifle_struct.h"
    functions:
      - name: "load"
        params:
          - name: "bullet"
            type: "Bullet&"
        return:
          type: "self_reference"
        source:
          c:
            name: "load_rifle_with_bullet"
            params:
              - value: "equivalent_struct_pointer"
              - type: "struct bullet_struct *"
                value: "bullet"
