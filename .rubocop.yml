plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 2.6
  NewCops: enable

Layout/LineLength:
  Max: 80

Metrics/AbcSize:
  Max: 80

Metrics/ClassLength:
  Max: 800

Metrics/BlockLength:
  Max: 50

Metrics/CyclomaticComplexity:
  Max: 25

Metrics/MethodLength:
  Max: 100

Metrics/ModuleLength:
  Max: 800

Metrics/PerceivedComplexity:
  Max: 25

Minitest/AssertWithExpectedArgument:
  Enabled: false

Minitest/MultipleAssertions:
  Max: 10

# using this name for blocks is the migration strategy until
# all Ruby versions we support support it
Style/ItAssignment:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/ExponentialNotation:
  Enabled: true

Style/GuardClause:
  Enabled: false
