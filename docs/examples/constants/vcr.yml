name: "mediacenter"
classes:
  - name: "Vcr"
    source:
      c:
        name: "vcr"
        members:
          - name: "channel"
            type: "int"
        includes:
          - "vcr.h"
    constants:
      - name: ["play", "command"]
        type: "int"
        value: "PLAY"
        includes:
          - "vcr.h"
      - name: ["pause", "command"]
        type: "int"
        value: "PAUSE"
      - name: ["fast", "forward", "command"]
        type: "int"
        value: "FAST_FORWARD"
      - name: ["rewind", "command"]
        type: "int"
        value: "REWIND"
      - name: ["volume", "up", "command"]
        type: "int"
        value: "VOLUME_UP"
      - name: ["volume", "down", "command"]
        type: "int"
        value: "VOLUME_DOWN"
    functions:
      - name: "SendCommand"
        params:
          - name: "command"
            type: "int"
        return:
          type: "int"
        source:
          c:
            name: "send_command"
            libraries: "vcr"
            params:
              - name: "equivalent_struct_pointer"
              - name: "command"
            return:
              type: "int"
