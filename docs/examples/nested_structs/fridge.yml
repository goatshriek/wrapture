name: "kitchen"
classes:
  - name: "IceMaker"
    libraries: "fridge"
    includes: "fridge.h"
    source:
      c:
        pointer:
          name: "struct ice_maker"
          includes: "fridge.h"
    constructors:
      - params:
          - name: "size"
            type: "int"
          - name: "can_crush_ice"
            type: "int"
        source:
          c:
            name: "new_ice_maker"
            params:
              - value: "size"
                type: "int"
              - value: "can_crush_ice"
                type: "int"
            return:
              type: "equivalent_struct_pointer"
  - name: "WaterFilter"
    libraries: "fridge"
    includes: "fridge.h"
    source:
      c:
        pointer:
          name: "struct water_filter"
          includes: "fridge.h"
    constructors:
      - params:
        - name: "purity_level"
          type: "int"
        source:
          c:
            name: "new_water_filter"
            params:
              - value: "purity_level"
                type: "int"
            return:
              type: "equivalent_struct_pointer"
  - name: "Freezer"
    libraries: "fridge"
    source:
      c:
        pointer:
          name: "struct freezer"
          includes: "fridge.h"
    constructors:
      - params:
        - name: "minimum_temp"
          type: "int"
        - name: "set_temp"
          type: "int"
        source:
          c:
            name: "new_freezer"
            params:
              - value: "minimum_temp"
                type: "int"
              - value: "set_temp"
                type: "int"
            return:
              type: "equivalent_struct_pointer"
  - name: "Fridge"
    libraries: "fridge"
    includes:
      - "fridge.h"
    source:
      c:
        pointer:
          name: "fridge"
          includes: "fridge.h"
    constructors:
      - params:
        - name: "temperature"
          type: "int"
        source:
          c:
            name: "new_fridge"
            params:
              - value: "temperature"
                type: "int"
            return:
              type: "equivalent_struct_pointer"
    functions:
      - name: "AddIceMaker"
        params:
          - name: "new_ice_maker"
            type: "IceMaker"
        source:
          c:
            name: "add_ice_maker_to_fridge"
            params:
              - name: "equivalent_struct_pointer"
              - name: "new_ice_maker"
                type: "struct ice_maker *"
      - name: "AddWaterFilter"
        params:
          - name: "new_filter"
            type: "WaterFilter"
        source:
          c:
            name: "add_water_filter_to_fridge"
            params:
              - name: "equivalent_struct_pointer"
              - name: "new_filter"
                type: "struct water_filter *"
      - name: "AddFreezer"
        params:
          - name: "new_freezer"
            type: "Freezer"
        source:
          c:
            name: "add_freezer_to_fridge"
            params:
              - name: "equivalent_struct_pointer"
              - name: "new_freezer"
                type: "struct freezer *"
      - name: "GetFreezerMinimumTemp"
        return:
          type: "int"
        source:
          c:
            name: "get_freezer_minimum_temp"
            params:
              - name: "equivalent_struct_pointer"
            return:
              type: "int"
      - name: "Print"
        source:
          c:
            name: "print_fridge"
            params:
              - name: "equivalent_struct_pointer"
