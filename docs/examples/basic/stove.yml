doc: "A collection of Kitchen appliance implementations."
classes:
  - name: "Stove"
    doc: "A humble stove."
    namespace: "kitchen"
    libraries: "stove"
    source:
      c:
        pointer:
          name: "stove"
          includes: "stove.h"
    equivalent_struct:
      name: "stove"
    constructors:
      - doc: "Creates a new stove."
        source:
          c:
            name: "new_stove"
            params:
              - name: "burner_count"
                type: "int"
            return:
              type: "equivalent_struct_pointer"
    destructor:
      source:
        c:
          name: "destroy_stove"
          params:
            - name: "equivalent_struct_pointer"
    functions:
      - name: "GetBurnerCount"
        doc: "Returns the number of burners on this stove."
        return:
          type: "int"
        source:
          c:
            name: "get_burner_count"
            params:
              - name: "equivalent_struct_pointer"
            return:
              type: "int"
      - name: "GetOvenTemp"
        return:
          type: "int"
        source:
          c:
            name: "get_oven_temp"
            params:
              - name: "equivalent_struct_pointer"
            return:
              type: "int"
      - name: "SetOvenTemp"
        params:
          - name: "new_temp"
            type: "int"
        source:
          c:
            name: "set_oven_temp"
            params:
              - name: "equivalent_struct_pointer"
              - name: "new_temp"
      - name: "GetBurnerLevel"
        params:
          - name: "burner_index"
            type: "int"
        return:
          type: "int"
        source:
          c:
            name: "get_burner_level"
            params:
              - name: "equivalent_struct_pointer"
              - name: "burner_index"
            return:
              type: "int"
      - name: "SetBurnerLevel"
        params:
          - name: "burner_index"
            type: "int"
          - name: "new_level"
            type: "int"
        source:
          c:
            name: "set_burner_level"
            params:
              - name: "equivalent_struct_pointer"
              - name: "burner_index"
              - name: "new_level"
      - name: "IsModelSupported"
        static: true
        return:
          type: "bool"
        params:
          - name: "model"
            type: "int"
        source:
          c:
            name: "is_model_supported"
            params:
              - name: "model"
            return:
              type: "bool"
