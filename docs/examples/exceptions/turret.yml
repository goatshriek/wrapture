# support for overloaded structs was introduced in version 0.3.0, so you will
# need to use this version of wrapture at a minimum
version: "0.6.0"
classes:
  - name: "Turret"
    namespace: "defense_turret"
    libraries: "turret"
    wrapped:
      c:
        pointer:
          name: "turret"
          includes: "turret.h"
    constructors:
      - wrapped:
          c:
            name: "new_turret"
            return:
              type: "equivalent_struct_pointer"
    destructor:
      wrapped:
        c:
          name: "destroy_turret"
          params:
            - value: "equivalent_struct_pointer"
    functions:
      - name: "Aim"
        params:
          - name: "x"
            type: "int"
          - name: "y"
            type: "int"
          - name: "z"
            type: "int"
        wrapped:
          c:
            name: "aim"
            params:
              - value: "equivalent_struct_pointer"
              - value: "x"
              - value: "y"
              - value: "z"
            return:
              type: "struct turret_error *"
            error_check:
              rules:
                - left_expression: "return_value"
                  condition: "not_equal"
                  right_expression: "success()"
              error_action:
                name: "throw_exception"
                type: "TargetingException"
                value: "return_value"
      - name: "AmmoCount"
        return:
          type: "int"
        wrapped:
          c:
            name: "ammo_count"
            params:
              - value: "equivalent_struct_pointer"
            return:
              type: "int"
      - name: "Fire"
        wrapped:
          c:
            name: "fire"
            params:
              - value: "equivalent_struct_pointer"
            return:
              type: "struct turret_error *"
            error_check:
              rules:
                - left_expression: "return_value"
                  condition: "not_equal"
                  right_expression: "success()"
              error_action:
                name: "throw_exception"
                type: "TurretException"
                value: "return_value"
      - name: "Reload"
        wrapped:
          c:
            name: "reload"
            params:
              - value: "equivalent_struct_pointer"
  - name: "TurretException"
    namespace: "defense_turret"
    exception: true
    wrapped:
      c:
        pointer:
          name: "turret_error"
          includes: "turret_error.h"
    constructors:
      - wrapped:
          c:
            name: "null_error"
            return:
              type: "equivalent_struct_pointer"
    functions:
      - name: "message"
        virtual: true
        return:
          type: "const char *"
        wrapped:
          c:
            name: "get_error_message"
            includes: "turret_error.h"
            params:
              - value: "equivalent_struct_pointer"
            return:
              type: "const char *"
  - name: "JammedException"
    namespace: "defense_turret"
    type: "pointer"
    parent:
      name: "TurretException"
    exception: true
    wrapped:
      c:
        pointer:
          name: "turret_error"
          includes: "turret_error.h"
          rules:
            - member_name: "code"
              condition: "equal"
              value: "JAMMED"
    functions:
      - name: "message"
        return:
          type: "const char *"
        wrapped:
          c:
            name: "get_error_message"
            includes: "turret_error.h"
            return:
              type: "const char *"
            params:
              - value: "equivalent_struct_pointer"
  - name: "OutOfAmmoException"
    namespace: "defense_turret"
    type: "pointer"
    parent:
      name: "TurretException"
    exception: true
    wrapped:
      c:
        pointer:
          name: "turret_error"
          includes: "turret_error.h"
          rules:
            - member_name: "code"
              condition: "equal"
              value: "OUT_OF_AMMO"
    functions:
      - name: "message"
        return:
          type: "const char *"
        wrapped:
          c:
            name: "get_error_message"
            includes: "turret_error.h"
            return:
              type: "const char *"
            params:
              - value: "equivalent_struct_pointer"
  - name: "TargetingException"
    namespace: "defense_turret"
    type: "pointer"
    parent:
      name: "TurretException"
    exception: true
    wrapped:
      c:
        pointer:
          name: "turret_error"
          includes: "turret_error.h"
          rules:
            - member_name: "code"
              condition: "equal"
              value: "TARGETING_ERROR"
    functions:
      - name: "message"
        return:
          type: "const char *"
        wrapped:
          c:
            name: "get_error_message"
            includes: "turret_error.h"
            params:
              - value: "equivalent_struct_pointer"
            return:
              type: "const char *"
