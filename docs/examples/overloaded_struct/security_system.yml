version: "0.6.0"
classes:
  - name: "SecurityEvent"
    namespace: "home_automation"
    libraries: "security_system"
    source:
      c:
        pointer:
          name: "event"
          includes: "security_system.h"
    constructors:
      - source:
          c:
            name: "new_default_event"
            return:
              type: "equivalent_struct_pointer"
      - source:
          c:
            name: "new_event"
            params:
              - name: "code"
                type: "int"
              - name: "data"
                type: "void *"
            return:
              type: "equivalent_struct_pointer"
    destructor:
      source:
        c:
          name: "destroy_event"
          params:
            - value: "equivalent_struct_pointer"
    functions:
      - name: "GetCode"
        virtual: true
        return:
          type: "int"
        source:
          c:
            name: "get_event_code"
            includes: "security_system.h"
            params:
              - value: "equivalent_struct_pointer"
            return:
              type: "int"
      - name: "NextEvent"
        static: true
        return:
          type: "SecurityEvent *"
          overloaded: true
        source:
          c:
            name: "get_next_event"
            includes: "security_system.h"
            return:
              type: "equivalent_struct_pointer"
      - name: "Print"
        virtual: true
        source:
          c:
            name: "print_event"
            includes: "security_system.h"
            params:
              - value: "equivalent_struct_pointer"
  - name: "CameraEvent"
    namespace: "home_automation"
    libraries: "security_system"
    parent:
      name: "SecurityEvent"
    source:
      c:
        pointer:
          name: "event"
          includes: "security_system.h"
          rules:
            - member_name: "code"
              condition: "equal"
              value: "CAMERA_EVENT"
    constructors:
      - source:
          c:
            name: "new_camera_event"
            params:
              - name: "description"
                type: "const char *"
            return:
              type: "equivalent_struct_pointer"
    functions:
      - name: "GetCode"
        return:
          type: "int"
        source:
          c:
            name: "get_camera_event_code"
            includes: "security_system.h"
            return:
              type: "int"
      - name: "Print"
        source:
          c:
            name: "print_camera_event"
            includes: "security_system.h"
            params:
              - value: "equivalent_struct_pointer"
  - name: "GlassBreakEvent"
    namespace: "home_automation"
    libraries: "security_system"
    parent:
      name: "SecurityEvent"
    source:
      c:
        pointer:
          name: "event"
          includes: "security_system.h"
          rules:
            - member_name: "code"
              condition: "equal"
              value: "GLASS_BREAK_EVENT"
    constructors:
      - source:
          c:
            name: "new_glass_break_event"
            params:
              - name: "level"
                type: "int"
            return:
              type: "equivalent_struct_pointer"
    functions:
      - name: "GetCode"
        return:
          type: "int"
        source:
          c:
            name: "get_glass_break_event_code"
            includes: "security_system.h"
            return:
              type: "int"
      - name: "Print"
        source:
          c:
            name: "print_glass_break_event"
            includes: "security_system.h"
            params:
              - value: "equivalent_struct_pointer"
  - name: "MotionEvent"
    namespace: "home_automation"
    libraries: "security_system"
    parent:
      name: "SecurityEvent"
    source:
      c:
        pointer:
          name: "event"
          includes: "security_system.h"
          rules:
            - member_name: "code"
              condition: "equal"
              value: "MOTION_EVENT"
    constructors:
      - source:
          c:
            name: "new_motion_event"
            params:
              - name: "description"
                type: "const char *"
            return:
              type: "equivalent_struct_pointer"
    functions:
      - name: "GetCode"
        return:
          type: "int"
        source:
          c:
            name: "get_motion_event_code"
            includes: "security_system.h"
            return:
              type: "int"
      - name: "Print"
        source:
          c:
            name: "print_motion_event"
            includes: "security_system.h"
            params:
              - value: "equivalent_struct_pointer"
