classes:
  - name: "Item"
    namespace: "library"
    libraries: "mylib"
    equivalent_struct:
      name: "mylib_item"
      includes: "mylib.h"
      members:
        - name: "name"
          type: "const char *"
          default_value: "NULL"
        - name: "checked_out"
          type: "bool"
          default_value: false
    functions:
      - name: CheckOut
        wrapped:
          c:
            name: "check_out_item"
            params:
              - name: "equivalent_struct_pointer"
            includes: "mylib.h"
  - name: "Book"
    namespace: "library"
    libraries: "mylib"
    parent:
      name: "Item"
    equivalent_struct:
      name: "mylib_item"
      includes: "mylib.h"
      members:
        - name: "name"
          type: "const char *"
          default_value: "NULL"
        - name: "checked_out"
          type: "bool"
          default_value: false
        - name: "page_count"
          type: "int"
          default_value: 0
    functions:
      - name: GetPageCount
        return:
          type: "int"
        wrapped:
          c:
            name: "get_page_count"
            params:
              - name: "equivalent_struct_pointer"
            includes: "mylib.h"
            return:
              type: "int"
